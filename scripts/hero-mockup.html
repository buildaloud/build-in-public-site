<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0c0e12; --panel:#13161c; --mint:#a3f7bf; --border:#232833; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:900px; overflow:hidden; }
  body {
    background:
      radial-gradient(1200px 700px at 50% 32%, rgba(163,247,191,0.10), transparent 70%),
      radial-gradient(900px 600px at 82% 88%, rgba(90,150,255,0.08), transparent 70%),
      linear-gradient(180deg, #0e1116, #0a0c10);
    position:relative;
    font-family: ui-sans-serif, system-ui;
  }
  /* faint grid */
  body::before{
    content:''; position:absolute; inset:0;
    background-image:linear-gradient(rgba(163,247,191,0.05) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(163,247,191,0.05) 1px, transparent 1px);
    background-size:48px 48px; mask-image:radial-gradient(circle at 50% 45%, black, transparent 78%);
  }
  .stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }

  /* laptop */
  .laptop{ position:relative; width:1180px; filter: drop-shadow(0 40px 80px rgba(0,0,0,0.55)) drop-shadow(0 0 60px rgba(163,247,191,0.12)); }
  .laptop .screen{ background:var(--panel); border:10px solid #1a1e26; border-radius:16px; overflow:hidden; aspect-ratio:16/9; }
  .laptop .screen img{ width:100%; height:100%; object-fit:cover; object-position:center center; display:block; }
  .laptop .base{ height:22px; width:118%; margin-left:-9%; background:linear-gradient(180deg,#20242e,#12151b); border-radius:0 0 22px 22px; box-shadow:inset 0 3px 6px rgba(0,0,0,.4); }
  .laptop .notch{ position:absolute; top:12px; left:50%; transform:translateX(-50%); width:80px; height:5px; background:#0a0c10; border-radius:3px; }

  /* phone */
  .phone{ position:absolute; width:250px; right:210px; bottom:70px;
    background:#0a0c10; border:8px solid #1a1e26; border-radius:36px; overflow:hidden; aspect-ratio:9/19.5;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,0.6)) drop-shadow(0 0 40px rgba(163,247,191,0.14)); }
  .phone img{ width:100%; height:100%; object-fit:cover; object-position:center center; display:block; }
  .phone .pill{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:70px; height:6px; background:#000; border-radius:4px; z-index:2; }
  .only-phone .laptop{ display:none; }
  .only-phone .phone{ position:static; width:300px; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="laptop" id="laptop">
      <div class="notch"></div>
      <div class="screen"><img id="laptopImg"></div>
      <div class="base"></div>
    </div>
    <div class="phone" id="phone">
      <div class="pill"></div>
      <img id="phoneImg">
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const lap = q.get('laptop'), ph = q.get('phone');
  const stage = document.getElementById('stage');
  if (lap) document.getElementById('laptopImg').src = lap; else document.getElementById('laptop').style.display='none';
  if (ph) document.getElementById('phoneImg').src = ph; else document.getElementById('phone').style.display='none';
  if (!lap && ph) stage.classList.add('only-phone');
</script>
</body>
</html>
