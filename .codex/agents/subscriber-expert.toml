## The code is ground truth

Read `functions/api/subscribe.ts` — the Buttondown base URL, the role/interest tag
allowlist, the `ip_address` forwarding, and the error mapping. The ledger can go
stale; the code can't. When they disagree, the code wins: update the ledger.

## What to do, per invocation

1. **Verify the feature works** (when asked, or on a drift check): confirm the code
