name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild so scheduled (future-dated) posts publish on their own.
    # Must fire AFTER the drip pubDate time (15:00Z) or the build filters the
    # day's post out and it appears a day late — so 16:00Z, past the 15:00Z slot
    # even with GitHub's scheduled-run lag.
    - cron: '0 16 * * *' # ~noon ET, after the 15:00Z drip slot
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name build-in-public-site --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
